# TenarisTrack · publicación con Docker (API + interfaz + MySQL 8)
#   1) cp .env.example .env   y completa los valores
#   2) docker compose up -d --build
#   3) Con dominio y HTTPS automático:  docker compose --profile https up -d --build
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    environment:
      MYSQL_DATABASE: tenaristrack
      MYSQL_USER: tenaristrack
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD en .env}
    volumes:
      - db_data:/var/lib/mysql
      # Solo se ejecuta la primera vez (volumen vacío): crea tablas, vistas y disparador.
      - ./database/esquema.sql:/docker-entrypoint-initdb.d/01-esquema.sql:ro
      # Para una demostración con datos simulados, quita el comentario de la línea siguiente
      # (y usa DEMO_MODE=true en .env). NO la uses en producción real.
      # - ./database/datos_demo.sql:/docker-entrypoint-initdb.d/02-datos-demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # La base de datos NO se publica al exterior: solo la ve la aplicación.

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: tenaristrack
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: tenaristrack
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env (32+ caracteres aleatorios)}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      DEMO_MODE: ${DEMO_MODE:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    ports:
      # Solo local; el acceso público es por Caddy (HTTPS). Para pruebas: http://localhost:4000
      - "127.0.0.1:${APP_PORT:-4000}:4000"

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on: [app]
    environment:
      DOMINIO: ${DOMINIO:?Define DOMINIO en .env (por ejemplo tenaristrack.midominio.com)}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  caddy_data:
  caddy_config:
